{{define "series_list"}}
{{template "header" .}}
<div class="box">
  <div class="bar">
    <h1>Series</h1>
    {{if .SignedIn}}<a href="/admin/series/new">Add series</a>{{end}}
  </div>
  {{if .Data}}
  <table class="catalog">
    <thead><tr><th></th><th>Series</th><th>Books</th><th>Merch</th></tr></thead>
    <tbody>
      {{range .Data}}{{template "series_card" .}}{{end}}
    </tbody>
  </table>
  {{else}}
  <p class="muted">No series yet.</p>
  {{end}}
</div>
{{template "footer" .}}
{{end}}
