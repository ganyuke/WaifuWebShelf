{{define "admin_store_form"}}
{{template "header" .}}
<p class="crumb"><a href="/admin">Admin</a></p>
<div class="box">
  <h1 class="bar">Edit {{.Data.Name}}</h1>
  <form class="stack trip-form-plain" method="post">
    <label for="name">Name</label>
    <input id="name" name="name" value="{{.Data.Name}}" required>
    {{template "item_error" dict "Key" "name" "Errors" .Data.Errors}}
    <label for="currency">Currency</label>
    <input id="currency" name="currency" value="{{.Data.Currency}}" list="currencies" maxlength="8">
    <datalist id="currencies"><option value="CAD"><option value="USD"><option value="JPY"><option value="EUR"></datalist>
    <label for="tax">Tax % <span class="hint" title="Used to suggest the total when you enter a receipt" tabindex="0">(?)</span></label>
    <input id="tax" name="tax" value="{{.Data.Tax}}" inputmode="decimal" placeholder="7.75">
    {{template "item_error" dict "Key" "tax" "Errors" .Data.Errors}}
    <div class="form-actions"><button type="submit">Save</button><a href="/admin">Cancel</a></div>
  </form>
</div>
{{template "footer" .}}
{{end}}
